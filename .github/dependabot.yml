version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-dependencies:
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    groups:
      site-dependencies:
        patterns:
          - "*"
