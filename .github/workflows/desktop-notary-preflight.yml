name: Desktop Notary Preflight

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful push-main CI run for exact current main
        required: true
        type: string
      ci_run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: textbutler-desktop-release
  cancel-in-progress: false

env:
  DESKTOP_CI_RUN_ID: ${{ inputs.ci_run_id }}
  DESKTOP_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}

jobs:
  authorize:
    if: github.repository_id == '1342143606' && github.repository == 'hraness/message-like-me' && github.ref == 'refs/heads/main' && github.actor_id == '894119'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact reviewed main before protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/notary-preflight-authority.ts

  validate:
    needs: authorize
    runs-on: macos-15
    timeout-minutes: 10
    environment: desktop-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Revalidate immediately before credential use
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/notary-preflight-authority.ts
      - name: Validate Apple credentials without signing or submitting an app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: bun --no-env-file --no-install apps/macos/distribution/notary-preflight.ts
      - name: Confirm source remains current after credential cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/notary-preflight-authority.ts
