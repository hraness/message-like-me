name: Promote website production
run-name: ${{ github.event_name == 'workflow_run' && format('Promote release target {0}', github.event.workflow_run.head_sha) || format('Promote release tag {0}', inputs.release_tag) }}

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact immutable Latest release tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-production-promotion
  cancel-in-progress: false

jobs:
  verify:
    name: Verify annotated release authority and reviewed ancestry
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_run_attempt: ${{ steps.request.outputs.release_run_attempt }}
      release_run_id: ${{ steps.request.outputs.release_run_id }}
      verified_sha: ${{ steps.identity.outputs.sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
      workflow_sha: ${{ steps.request.outputs.workflow_sha }}
    steps:
      - name: Bind request to reviewed main ancestry
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_SHA: ${{ github.sha }}
          EXPECTED_RELEASE_WORKFLOW_ID: ${{ vars.MLM_RELEASE_WORKFLOW_ID }}
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          UPSTREAM_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          if [[ "$DEFAULT_BRANCH" != "main" || "$EVENT_REF" != "refs/heads/main" || "$EVENT_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Website production promotion must run from the reviewed main workflow"
            exit 1
          fi
          if [[ ! "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Promotion workflow has no exact source commit"
            exit 1
          fi
          release_sha=""
          release_run_id=""
          release_run_attempt=""
          case "$EVENT_NAME" in
            workflow_run)
              if [[ ! "$EXPECTED_RELEASE_WORKFLOW_ID" =~ ^[1-9][0-9]*$ || "$UPSTREAM_WORKFLOW_ID" != "$EXPECTED_RELEASE_WORKFLOW_ID" ]]; then
                echo "::error::Upstream workflow ID is not the checked Release workflow ID"
                exit 1
              fi
              if [[ "$UPSTREAM_WORKFLOW_NAME" != "Release" || "$UPSTREAM_PATH" != ".github/workflows/release.yml" || "$UPSTREAM_EVENT" != "push" ]]; then
                echo "::error::Upstream run is not the exact tag Release workflow"
                exit 1
              fi
              if [[ ! "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ || ! "$UPSTREAM_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || "$UPSTREAM_CONCLUSION" != "success" ]]; then
                echo "::error::Upstream Release must be one successful positive run attempt"
                exit 1
              fi
              if [[ "$UPSTREAM_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" || ! "$UPSTREAM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Upstream Release source is not this exact repository"
                exit 1
              fi
              requested_tag="$UPSTREAM_HEAD_BRANCH"
              release_sha="$UPSTREAM_HEAD_SHA"
              release_run_id="$UPSTREAM_RUN_ID"
              release_run_attempt="$UPSTREAM_RUN_ATTEMPT"
              ;;
            workflow_dispatch)
              requested_tag="$INPUT_RELEASE_TAG"
              ;;
            *)
              echo "::error::Unsupported website production trigger $EVENT_NAME"
              exit 1
              ;;
          esac
          if [[ ! "$requested_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Promotion input is not one stable semantic-version tag"
            exit 1
          fi
          repository_default="$(gh api "/repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$repository_default" != "main" || "$current_main_sha" != "$EVENT_SHA" ]]; then
            echo "::error::Promotion workflow source $EVENT_SHA is not the checked current main $current_main_sha"
            exit 1
          fi
          printf 'release_run_attempt=%s\n' "$release_run_attempt" >> "$GITHUB_OUTPUT"
          printf 'release_run_id=%s\n' "$release_run_id" >> "$GITHUB_OUTPUT"
          printf 'requested_tag=%s\n' "$requested_tag" >> "$GITHUB_OUTPUT"
          printf 'upstream_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'workflow_sha=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ steps.request.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Verify exact annotated release coordinate
        id: identity
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ steps.request.outputs.workflow_sha }}
          REQUESTED_TAG: ${{ steps.request.outputs.requested_tag }}
          UPSTREAM_SHA: ${{ steps.request.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          authority_output="$(node --experimental-strip-types ./scripts/release-ref-authority.ts promotion "$REQUESTED_TAG" "$RECOVERY_WORKFLOW_SHA" "$UPSTREAM_SHA")"
          printf '%s\n' "$authority_output" >> "$GITHUB_OUTPUT"
          workflow_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tag_commit="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
          package_version="$(git show "$tag_commit:package.json" | node -e 'let value=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(value); if (typeof parsed.version !== "string") process.exit(1); process.stdout.write(parsed.version); });')"
          site_version="$(git show "$tag_commit:site/package.json" | node -e 'let value=""; process.stdin.setEncoding("utf8"); process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => { const parsed = JSON.parse(value); if (typeof parsed.version !== "string") process.exit(1); process.stdout.write(parsed.version); });')"
          if [[ "$REQUESTED_TAG" != "v$package_version" || "$site_version" != "$package_version" ]]; then
            echo "::error::Promotion tag, release package, and release site versions do not agree"
            exit 1
          fi
          VERIFIED_SHA="$tag_commit" VERIFIED_TAG="$REQUESTED_TAG" \
            node ./scripts/release-provider-outcome.mjs revalidate-authority

  public_admission:
    name: Admit exact public artifacts before provider work
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Admit the exact public npm and GitHub artifacts
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts

  provider_baseline:
    name: Snapshot provider baseline
    needs:
      - verify
      - public_admission
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      advance_required: ${{ steps.baseline.outputs.advance_required }}
      ref_sha: ${{ steps.baseline.outputs.ref_sha }}
      receipt: ${{ steps.baseline.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Revalidate authority before provider baseline
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs revalidate-authority
      - name: Snapshot Production deployments before promotion
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
        run: node ./scripts/release-provider-outcome.mjs baseline

  advance_production_ref_preflight:
    name: Re-admit authority before the production-ref writer
    needs:
      - verify
      - provider_baseline
    if: needs.provider_baseline.outputs.advance_required == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Revalidate authority before production-ref mutation
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs revalidate-authority
      - name: Prove the complete workflow-control range before environment admission
        env:
          DEFAULT_BRANCH: main
          EXPECTED_OLD_SHA: ${{ needs.provider_baseline.outputs.ref_sha }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: |
          set -euo pipefail
          node --experimental-strip-types ./scripts/release-ref-authority.ts promotion "$VERIFIED_TAG" "$RECOVERY_WORKFLOW_SHA" "$VERIFIED_SHA" >/dev/null
          node ./scripts/release-workflow-range.mjs "$EXPECTED_OLD_SHA" "$VERIFIED_SHA" >/dev/null
      - name: Revalidate public artifacts before production-ref mutation
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts

  write_production_ref:
    name: Attest, advance, and consume production authority
    needs:
      - verify
      - provider_baseline
      - advance_production_ref_preflight
    if: needs.provider_baseline.outputs.advance_required == 'true'
    permissions:
      contents: write
      statuses: read
    environment: { name: production-ref-writer-key, deployment: false }
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      attestation_receipt: ${{ steps.attest.outputs.receipt }}
      consumption_receipt: ${{ steps.consume.outputs.receipt }}
      denial_receipt: ${{ steps.deny.outputs.receipt }}
      precondition_receipt: ${{ steps.precondition.outputs.receipt }}
      receipt: ${{ steps.promotion.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Pin the complete production authority TCB to reviewed hashes
        id: initial_pin
        env:
          APP_TOKEN_SHA256: 8ba1f4155a7428cc924c4c8b468c38c599e52bb1760654ebc6b4056f0a6cb526
          PRODUCTION_AUTHORITY_SHA256: 1f7ffb6c9dc8a65e023a1b0052007ff1b1ff8c8328596ca37872cf1fb8a3efca
          PROVIDER_SHA256: ce0d3ec4915670d16aa2f318e28f637c417d94e9620deeec929975aa91ea837f
          REF_AUTHORITY_SHA256: 402526c0f249536294190445fd5d14e2b5d6b92f5c56627aaa6922304675c768
          REF_WRITER_SHA256: 30710ab2db7d47176d2736a189455765a51574a5b692674bb18edfa7d3ca1c59
          STATUS_ATTESTER_SHA256: 13f7cd223a048227e474eb3748af128d0e76b8ea26731fa5d6146038a93a7f98
          WORKFLOW_RANGE_SHA256: 99b94188a26f1dbbe2b5103729ab54ffcc639be5196f9e388443a6b9a0f26844
        run: |
          set -euo pipefail
          test "$(shasum -a 256 scripts/release-app-token.mjs | cut -d ' ' -f 1)" = "$APP_TOKEN_SHA256"
          test "$(shasum -a 256 scripts/release-production-authority.mjs | cut -d ' ' -f 1)" = "$PRODUCTION_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-provider-outcome.mjs | cut -d ' ' -f 1)" = "$PROVIDER_SHA256"
          test "$(shasum -a 256 scripts/release-ref-authority.ts | cut -d ' ' -f 1)" = "$REF_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-ref-writer.mjs | cut -d ' ' -f 1)" = "$REF_WRITER_SHA256"
          test "$(shasum -a 256 scripts/release-status-attester.mjs | cut -d ' ' -f 1)" = "$STATUS_ATTESTER_SHA256"
          test "$(shasum -a 256 scripts/release-workflow-range.mjs | cut -d ' ' -f 1)" = "$WORKFLOW_RANGE_SHA256"
      - name: Re-prove the complete workflow-control range before reading the key
        id: workflow_range
        env:
          DEFAULT_BRANCH: main
          EXPECTED_OLD_SHA: ${{ needs.provider_baseline.outputs.ref_sha }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: |
          set -euo pipefail
          node --experimental-strip-types ./scripts/release-ref-authority.ts promotion "$VERIFIED_TAG" "$RECOVERY_WORKFLOW_SHA" "$VERIFIED_SHA" >/dev/null
          node ./scripts/release-workflow-range.mjs "$EXPECTED_OLD_SHA" "$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
      - name: Re-pin the complete TCB before the App-only precondition
        id: pre_precondition_pin
        env:
          APP_TOKEN_SHA256: 8ba1f4155a7428cc924c4c8b468c38c599e52bb1760654ebc6b4056f0a6cb526
          PRODUCTION_AUTHORITY_SHA256: 1f7ffb6c9dc8a65e023a1b0052007ff1b1ff8c8328596ca37872cf1fb8a3efca
          PROVIDER_SHA256: ce0d3ec4915670d16aa2f318e28f637c417d94e9620deeec929975aa91ea837f
          REF_AUTHORITY_SHA256: 402526c0f249536294190445fd5d14e2b5d6b92f5c56627aaa6922304675c768
          REF_WRITER_SHA256: 30710ab2db7d47176d2736a189455765a51574a5b692674bb18edfa7d3ca1c59
          STATUS_ATTESTER_SHA256: 13f7cd223a048227e474eb3748af128d0e76b8ea26731fa5d6146038a93a7f98
          WORKFLOW_RANGE_SHA256: 99b94188a26f1dbbe2b5103729ab54ffcc639be5196f9e388443a6b9a0f26844
        run: |
          set -euo pipefail
          test "$(shasum -a 256 scripts/release-app-token.mjs | cut -d ' ' -f 1)" = "$APP_TOKEN_SHA256"
          test "$(shasum -a 256 scripts/release-production-authority.mjs | cut -d ' ' -f 1)" = "$PRODUCTION_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-provider-outcome.mjs | cut -d ' ' -f 1)" = "$PROVIDER_SHA256"
          test "$(shasum -a 256 scripts/release-ref-authority.ts | cut -d ' ' -f 1)" = "$REF_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-ref-writer.mjs | cut -d ' ' -f 1)" = "$REF_WRITER_SHA256"
          test "$(shasum -a 256 scripts/release-status-attester.mjs | cut -d ' ' -f 1)" = "$STATUS_ATTESTER_SHA256"
          test "$(shasum -a 256 scripts/release-workflow-range.mjs | cut -d ' ' -f 1)" = "$WORKFLOW_RANGE_SHA256"
      - name: Terminalize the target before proving required-status denial
        id: precondition
        if: ${{ steps.workflow_range.outcome == 'success' && steps.pre_precondition_pin.outcome == 'success' }}
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MLM_RELEASE_APP_CLIENT_ID: ${{ vars.MLM_RELEASE_APP_CLIENT_ID }}
          MLM_RELEASE_APP_ID: ${{ vars.MLM_RELEASE_APP_ID }}
          MLM_RELEASE_APP_INSTALLATION_ID: ${{ vars.MLM_RELEASE_APP_INSTALLATION_ID }}
          MLM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLM_RELEASE_APP_PRIVATE_KEY }}
          MLM_RELEASE_APP_SLUG: ${{ vars.MLM_RELEASE_APP_SLUG }}
          TARGET: ${{ needs.verify.outputs.verified_sha }}
        run: node ./scripts/release-production-authority.mjs consume
      - name: Re-pin the complete TCB before the denial writer
        id: pre_denial_pin
        env:
          APP_TOKEN_SHA256: 8ba1f4155a7428cc924c4c8b468c38c599e52bb1760654ebc6b4056f0a6cb526
          PRODUCTION_AUTHORITY_SHA256: 1f7ffb6c9dc8a65e023a1b0052007ff1b1ff8c8328596ca37872cf1fb8a3efca
          PROVIDER_SHA256: ce0d3ec4915670d16aa2f318e28f637c417d94e9620deeec929975aa91ea837f
          REF_AUTHORITY_SHA256: 402526c0f249536294190445fd5d14e2b5d6b92f5c56627aaa6922304675c768
          REF_WRITER_SHA256: 30710ab2db7d47176d2736a189455765a51574a5b692674bb18edfa7d3ca1c59
          STATUS_ATTESTER_SHA256: 13f7cd223a048227e474eb3748af128d0e76b8ea26731fa5d6146038a93a7f98
          WORKFLOW_RANGE_SHA256: 99b94188a26f1dbbe2b5103729ab54ffcc639be5196f9e388443a6b9a0f26844
        run: |
          set -euo pipefail
          test "$(shasum -a 256 scripts/release-app-token.mjs | cut -d ' ' -f 1)" = "$APP_TOKEN_SHA256"
          test "$(shasum -a 256 scripts/release-production-authority.mjs | cut -d ' ' -f 1)" = "$PRODUCTION_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-provider-outcome.mjs | cut -d ' ' -f 1)" = "$PROVIDER_SHA256"
          test "$(shasum -a 256 scripts/release-ref-authority.ts | cut -d ' ' -f 1)" = "$REF_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-ref-writer.mjs | cut -d ' ' -f 1)" = "$REF_WRITER_SHA256"
          test "$(shasum -a 256 scripts/release-status-attester.mjs | cut -d ' ' -f 1)" = "$STATUS_ATTESTER_SHA256"
          test "$(shasum -a 256 scripts/release-workflow-range.mjs | cut -d ' ' -f 1)" = "$WORKFLOW_RANGE_SHA256"
      - name: Prove the writer cannot advance without current success
        id: deny
        env:
          AUTHORITY_PRECONDITION_RECEIPT: ${{ steps.precondition.outputs.receipt }}
          BASELINE_RECEIPT: ${{ needs.provider_baseline.outputs.receipt }}
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MLM_RELEASE_REF_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
          WORKFLOW_RANGE_RECEIPT: ${{ steps.workflow_range.outputs.receipt }}
        run: node ./scripts/release-provider-outcome.mjs deny-production
      - name: Re-pin the complete TCB after the denial writer
        id: pre_attest_pin
        env:
          APP_TOKEN_SHA256: 8ba1f4155a7428cc924c4c8b468c38c599e52bb1760654ebc6b4056f0a6cb526
          PRODUCTION_AUTHORITY_SHA256: 1f7ffb6c9dc8a65e023a1b0052007ff1b1ff8c8328596ca37872cf1fb8a3efca
          PROVIDER_SHA256: ce0d3ec4915670d16aa2f318e28f637c417d94e9620deeec929975aa91ea837f
          REF_AUTHORITY_SHA256: 402526c0f249536294190445fd5d14e2b5d6b92f5c56627aaa6922304675c768
          REF_WRITER_SHA256: 30710ab2db7d47176d2736a189455765a51574a5b692674bb18edfa7d3ca1c59
          STATUS_ATTESTER_SHA256: 13f7cd223a048227e474eb3748af128d0e76b8ea26731fa5d6146038a93a7f98
          WORKFLOW_RANGE_SHA256: 99b94188a26f1dbbe2b5103729ab54ffcc639be5196f9e388443a6b9a0f26844
        run: |
          set -euo pipefail
          test "$(shasum -a 256 scripts/release-app-token.mjs | cut -d ' ' -f 1)" = "$APP_TOKEN_SHA256"
          test "$(shasum -a 256 scripts/release-production-authority.mjs | cut -d ' ' -f 1)" = "$PRODUCTION_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-provider-outcome.mjs | cut -d ' ' -f 1)" = "$PROVIDER_SHA256"
          test "$(shasum -a 256 scripts/release-ref-authority.ts | cut -d ' ' -f 1)" = "$REF_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-ref-writer.mjs | cut -d ' ' -f 1)" = "$REF_WRITER_SHA256"
          test "$(shasum -a 256 scripts/release-status-attester.mjs | cut -d ' ' -f 1)" = "$STATUS_ATTESTER_SHA256"
          test "$(shasum -a 256 scripts/release-workflow-range.mjs | cut -d ' ' -f 1)" = "$WORKFLOW_RANGE_SHA256"
      - name: Attest the exact release with the status-only App and revoke its token
        id: attest
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MLM_RELEASE_APP_CLIENT_ID: ${{ vars.MLM_RELEASE_APP_CLIENT_ID }}
          MLM_RELEASE_APP_ID: ${{ vars.MLM_RELEASE_APP_ID }}
          MLM_RELEASE_APP_INSTALLATION_ID: ${{ vars.MLM_RELEASE_APP_INSTALLATION_ID }}
          MLM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLM_RELEASE_APP_PRIVATE_KEY }}
          MLM_RELEASE_APP_SLUG: ${{ vars.MLM_RELEASE_APP_SLUG }}
          TARGET: ${{ needs.verify.outputs.verified_sha }}
        run: node ./scripts/release-production-authority.mjs attest
      - name: Re-pin the complete TCB after the App-only attestation
        id: post_attest_pin
        if: ${{ always() && steps.workflow_range.outcome == 'success' && steps.pre_precondition_pin.outcome == 'success' && steps.precondition.outcome != 'skipped' }}
        env:
          APP_TOKEN_SHA256: 8ba1f4155a7428cc924c4c8b468c38c599e52bb1760654ebc6b4056f0a6cb526
          PRODUCTION_AUTHORITY_SHA256: 1f7ffb6c9dc8a65e023a1b0052007ff1b1ff8c8328596ca37872cf1fb8a3efca
          PROVIDER_SHA256: ce0d3ec4915670d16aa2f318e28f637c417d94e9620deeec929975aa91ea837f
          REF_AUTHORITY_SHA256: 402526c0f249536294190445fd5d14e2b5d6b92f5c56627aaa6922304675c768
          REF_WRITER_SHA256: 30710ab2db7d47176d2736a189455765a51574a5b692674bb18edfa7d3ca1c59
          STATUS_ATTESTER_SHA256: 13f7cd223a048227e474eb3748af128d0e76b8ea26731fa5d6146038a93a7f98
          WORKFLOW_RANGE_SHA256: 99b94188a26f1dbbe2b5103729ab54ffcc639be5196f9e388443a6b9a0f26844
        run: |
          set -euo pipefail
          test "$(shasum -a 256 scripts/release-app-token.mjs | cut -d ' ' -f 1)" = "$APP_TOKEN_SHA256"
          test "$(shasum -a 256 scripts/release-production-authority.mjs | cut -d ' ' -f 1)" = "$PRODUCTION_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-provider-outcome.mjs | cut -d ' ' -f 1)" = "$PROVIDER_SHA256"
          test "$(shasum -a 256 scripts/release-ref-authority.ts | cut -d ' ' -f 1)" = "$REF_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-ref-writer.mjs | cut -d ' ' -f 1)" = "$REF_WRITER_SHA256"
          test "$(shasum -a 256 scripts/release-status-attester.mjs | cut -d ' ' -f 1)" = "$STATUS_ATTESTER_SHA256"
          test "$(shasum -a 256 scripts/release-workflow-range.mjs | cut -d ' ' -f 1)" = "$WORKFLOW_RANGE_SHA256"
      - name: Read current authority and advance the exact production ref
        id: promotion
        if: ${{ steps.attest.outcome == 'success' && steps.post_attest_pin.outcome == 'success' }}
        env:
          AUTHORITY_ATTESTATION_RECEIPT: ${{ steps.attest.outputs.receipt }}
          AUTHORITY_DENIAL_RECEIPT: ${{ steps.deny.outputs.receipt }}
          BASELINE_RECEIPT: ${{ needs.provider_baseline.outputs.receipt }}
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          MLM_RELEASE_REF_TOKEN: ${{ github.token }}
          PROMOTION_EXPECTED_MODE: advanced
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
          WORKFLOW_RANGE_RECEIPT: ${{ steps.workflow_range.outputs.receipt }}
        run: node ./scripts/release-provider-outcome.mjs promote
      - name: Re-pin the complete TCB after the writer-only process
        id: post_writer_pin
        if: ${{ always() && steps.workflow_range.outcome == 'success' && steps.pre_precondition_pin.outcome == 'success' && steps.precondition.outcome != 'skipped' }}
        env:
          APP_TOKEN_SHA256: 8ba1f4155a7428cc924c4c8b468c38c599e52bb1760654ebc6b4056f0a6cb526
          PRODUCTION_AUTHORITY_SHA256: 1f7ffb6c9dc8a65e023a1b0052007ff1b1ff8c8328596ca37872cf1fb8a3efca
          PROVIDER_SHA256: ce0d3ec4915670d16aa2f318e28f637c417d94e9620deeec929975aa91ea837f
          REF_AUTHORITY_SHA256: 402526c0f249536294190445fd5d14e2b5d6b92f5c56627aaa6922304675c768
          REF_WRITER_SHA256: 30710ab2db7d47176d2736a189455765a51574a5b692674bb18edfa7d3ca1c59
          STATUS_ATTESTER_SHA256: 13f7cd223a048227e474eb3748af128d0e76b8ea26731fa5d6146038a93a7f98
          WORKFLOW_RANGE_SHA256: 99b94188a26f1dbbe2b5103729ab54ffcc639be5196f9e388443a6b9a0f26844
        run: |
          set -euo pipefail
          test "$(shasum -a 256 scripts/release-app-token.mjs | cut -d ' ' -f 1)" = "$APP_TOKEN_SHA256"
          test "$(shasum -a 256 scripts/release-production-authority.mjs | cut -d ' ' -f 1)" = "$PRODUCTION_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-provider-outcome.mjs | cut -d ' ' -f 1)" = "$PROVIDER_SHA256"
          test "$(shasum -a 256 scripts/release-ref-authority.ts | cut -d ' ' -f 1)" = "$REF_AUTHORITY_SHA256"
          test "$(shasum -a 256 scripts/release-ref-writer.mjs | cut -d ' ' -f 1)" = "$REF_WRITER_SHA256"
          test "$(shasum -a 256 scripts/release-status-attester.mjs | cut -d ' ' -f 1)" = "$STATUS_ATTESTER_SHA256"
          test "$(shasum -a 256 scripts/release-workflow-range.mjs | cut -d ' ' -f 1)" = "$WORKFLOW_RANGE_SHA256"
      - name: Consume authority and revoke the terminal status-only token
        id: consume
        if: ${{ always() && steps.workflow_range.outcome == 'success' && steps.pre_precondition_pin.outcome == 'success' && steps.precondition.outcome != 'skipped' && steps.post_writer_pin.outcome == 'success' }}
        env:
          AUTHORITY_ATTESTATION_RECEIPT: ${{ steps.attest.outputs.receipt }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MLM_RELEASE_APP_CLIENT_ID: ${{ vars.MLM_RELEASE_APP_CLIENT_ID }}
          MLM_RELEASE_APP_ID: ${{ vars.MLM_RELEASE_APP_ID }}
          MLM_RELEASE_APP_INSTALLATION_ID: ${{ vars.MLM_RELEASE_APP_INSTALLATION_ID }}
          MLM_RELEASE_APP_PRIVATE_KEY: ${{ secrets.MLM_RELEASE_APP_PRIVATE_KEY }}
          MLM_RELEASE_APP_SLUG: ${{ vars.MLM_RELEASE_APP_SLUG }}
          PROMOTION_RECEIPT_SHA256: ${{ steps.promotion.outputs.receipt_sha256 }}
          TARGET: ${{ needs.verify.outputs.verified_sha }}
        run: node ./scripts/release-production-authority.mjs consume

  advance_production_ref:
    name: Re-admit authority after the production-ref writer
    needs:
      - verify
      - provider_baseline
      - write_production_ref
    if: needs.provider_baseline.outputs.advance_required == 'true'
    permissions:
      contents: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      receipt: ${{ needs.write_production_ref.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Bind the split status, writer, and terminal receipts
        env:
          AUTHORITY_ATTESTATION_RECEIPT: ${{ needs.write_production_ref.outputs.attestation_receipt }}
          AUTHORITY_CONSUMPTION_RECEIPT: ${{ needs.write_production_ref.outputs.consumption_receipt }}
          AUTHORITY_DENIAL_RECEIPT: ${{ needs.write_production_ref.outputs.denial_receipt }}
          AUTHORITY_PRECONDITION_RECEIPT: ${{ needs.write_production_ref.outputs.precondition_receipt }}
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RECEIPT: ${{ needs.write_production_ref.outputs.receipt }}
        run: node ./scripts/release-provider-outcome.mjs finalize-authority
      - name: Revalidate authority after production-ref mutation
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs revalidate-authority
      - name: Revalidate public artifacts after production-ref mutation
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts

  confirm_existing_production_ref:
    name: Confirm already-exact website production
    needs:
      - verify
      - provider_baseline
    if: needs.provider_baseline.outputs.advance_required == 'false'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      receipt: ${{ steps.promotion.outputs.receipt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Revalidate authority before no-write recovery
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs revalidate-authority
      - name: Revalidate public artifacts before no-write recovery
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts
      - name: Confirm verified website production source
        id: promotion
        env:
          BASELINE_RECEIPT: ${{ needs.provider_baseline.outputs.receipt }}
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PROMOTION_EXPECTED_MODE: already-exact
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs promote
      - name: Revalidate authority after no-write recovery
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs revalidate-authority
      - name: Revalidate public artifacts after no-write recovery
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts

  select_promotion:
    name: Select the exact promotion receipt
    needs:
      - verify
      - provider_baseline
      - advance_production_ref
      - confirm_existing_production_ref
    if: >-
      ${{ always() &&
          needs.verify.result == 'success' &&
          needs.provider_baseline.result == 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      receipt: ${{ steps.receipt.outputs.receipt }}
    steps:
      - name: Bind exactly one promotion path
        id: receipt
        env:
          ADVANCE_REQUIRED: ${{ needs.provider_baseline.outputs.advance_required }}
          ADVANCE_RESULT: ${{ needs.advance_production_ref.result }}
          ADVANCED_RECEIPT: ${{ needs.advance_production_ref.outputs.receipt }}
          EXISTING_RESULT: ${{ needs.confirm_existing_production_ref.result }}
          EXISTING_RECEIPT: ${{ needs.confirm_existing_production_ref.outputs.receipt }}
        run: |
          set -euo pipefail
          case "$ADVANCE_REQUIRED" in
            true)
              if [[ "$ADVANCE_RESULT" != "success" || "$EXISTING_RESULT" != "skipped" || -n "$EXISTING_RECEIPT" ]]; then
                echo "::error::Advanced promotion did not take exactly one path"
                exit 1
              fi
              receipt="$ADVANCED_RECEIPT"
              ;;
            false)
              if [[ "$EXISTING_RESULT" != "success" || "$ADVANCE_RESULT" != "skipped" || -n "$ADVANCED_RECEIPT" ]]; then
                echo "::error::Already-exact recovery did not take exactly one path"
                exit 1
              fi
              receipt="$EXISTING_RECEIPT"
              ;;
            *)
              echo "::error::Provider baseline did not select a promotion path"
              exit 1
              ;;
          esac
          if [[ -z "$receipt" || "${#receipt}" -gt 65536 || ! "$receipt" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Promotion receipt is missing or malformed"
            exit 1
          fi
          printf 'receipt=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

  post_promotion_admission:
    name: Re-admit authority and public bytes after the selected promotion path
    needs:
      - verify
      - select_promotion
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Revalidate authority after the selected promotion path
        env:
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs revalidate-authority
      - name: Revalidate public artifacts after the selected promotion path
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts

  provider_outcome:
    name: Verify provider outcome
    needs:
      - verify
      - provider_baseline
      - select_promotion
      - post_promotion_admission
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Revalidate public artifacts before provider outcome
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts
      - name: Verify exact Vercel Production outcome
        env:
          BASELINE_RECEIPT: ${{ needs.provider_baseline.outputs.receipt }}
          DEFAULT_BRANCH: main
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RECEIPT: ${{ needs.select_promotion.outputs.receipt }}
          RECOVERY_WORKFLOW_SHA: ${{ needs.verify.outputs.workflow_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: node ./scripts/release-provider-outcome.mjs wait
      - name: Revalidate public artifacts after provider outcome
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts

  final_public_admission:
    name: Re-admit exact public artifacts after provider success
    needs:
      - verify
      - provider_outcome
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ needs.verify.outputs.workflow_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Re-admit the exact public npm and GitHub artifacts
        env:
          DEFAULT_BRANCH: main
          EXPECTED_RELEASE_RUN_ATTEMPT: ${{ needs.verify.outputs.release_run_attempt }}
          EXPECTED_RELEASE_RUN_ID: ${{ needs.verify.outputs.release_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
          VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
        run: bun run ./scripts/check-public-release.ts
