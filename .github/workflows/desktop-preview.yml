name: Desktop Preview

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current-main commit to build
        required: true
        type: string
      ci_run_id:
        description: Successful push-main CI run for that exact source
        required: true
        type: string
      ci_run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: textbutler-desktop-preview
  cancel-in-progress: false

env:
  PREVIEW_SOURCE_SHA: ${{ inputs.source_sha }}
  PREVIEW_CI_RUN_ID: ${{ inputs.ci_run_id }}
  PREVIEW_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}

jobs:
  build:
    if: github.repository_id == '1342143606' && github.repository == 'hraness/message-like-me' && github.ref == 'refs/heads/main' && github.actor_id == '894119'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      receipt_sha256: ${{ steps.pack.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact current main and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/preview-authority.ts
      - name: Pin Apple Silicon native toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Build and smoke without Apple credentials
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd apps/macos check
          cargo test --manifest-path apps/macos/src-tauri/Cargo.toml --locked
          bun run --cwd apps/macos native:package
          bun run --cwd apps/macos native:smoke
      - name: Seal unsigned preview handoff
        id: pack
        run: |
          set -euo pipefail
          bun --no-env-file --no-install apps/macos/distribution/prepare.ts "$GITHUB_SHA" "$RUNNER_TEMP/textbutler-unsigned"
          bun --no-env-file --no-install apps/macos/distribution/workflow-artifact.ts unsigned "$RUNNER_TEMP/textbutler-unsigned"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: artifact
        with:
          name: textbutler-desktop-preview-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/textbutler-unsigned
          if-no-files-found: error
          retention-days: 14

  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 35
    environment: desktop-signing
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact unsigned preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: bun --no-env-file --no-install apps/macos/distribution/preview-authority.ts unsigned "$PREVIEW_ARTIFACT_ID"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/textbutler-input
      - name: Revalidate before credential use
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/preview-authority.ts
      - name: Sign preview without notarization or publication
        env:
          RECEIPT_SHA256: ${{ needs.build.outputs.receipt_sha256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY_SHA1: ${{ vars.APPLE_SIGNING_IDENTITY_SHA1 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: bun --no-env-file --no-install apps/macos/distribution/preview-sign.ts "$RUNNER_TEMP/textbutler-input" "$RECEIPT_SHA256" "$GITHUB_SHA" "$RUNNER_TEMP/textbutler-preview"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: textbutler-desktop-preview-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/textbutler-preview/*
          if-no-files-found: error
          retention-days: 14
