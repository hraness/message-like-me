name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      verified_sha: ${{ steps.identity.outputs.sha }}
      verified_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" || "$EVENT_REF_TYPE" != "tag" || "$EVENT_REF" != "refs/tags/$EVENT_REF_NAME" ]]; then
            echo "::error::Release request is not one exact tag push"
            exit 1
          fi
          if [[ ! "$EVENT_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release request is not one stable semantic-version tag"
            exit 1
          fi
          printf 'tag=%s\n' "$EVENT_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.request.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Verify exact release identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'const value = await Bun.file("package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          site_version="$(bun -e 'const value = await Bun.file("site/package.json").json(); if (typeof value.version !== "string") process.exit(1); process.stdout.write(value.version)')"
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not a stable semantic version"
            exit 1
          fi
          if [[ "$site_version" != "$package_version" ]]; then
            echo "::error::Site version $site_version does not match package version $package_version"
            exit 1
          fi
          expected_tag="v$package_version"
          if [[ "$REQUESTED_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag $REQUESTED_TAG does not match package version $expected_tag"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")"
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::error::Checked-out source $head_commit does not match tag commit $tag_commit"
            exit 1
          fi
          default_head="$(git rev-parse --verify "origin/$DEFAULT_BRANCH^{commit}")"
          if [[ "$default_head" != "$tag_commit" ]]; then
            echo "::error::Tag release commit $tag_commit is not current $DEFAULT_BRANCH head $default_head"
            exit 1
          fi
          newest_stable_tag="$(git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | LC_ALL=C sort -V | tail -n 1)"
          if [[ "$newest_stable_tag" != "$REQUESTED_TAG" ]]; then
            echo "::error::Tag $REQUESTED_TAG is not the newest stable tag ($newest_stable_tag)"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: site
      - run: bun run sync:readme
        working-directory: site
      - run: bun run test
        working-directory: site
      - run: bun run lint
        working-directory: site
      - run: bun run build
        working-directory: site
      - name: Verify generated documentation views
        run: git diff --exit-code -- site/app/readme.generated.ts site/app/methodology.generated.ts site/app/research.generated.ts
      - name: Verify checked distribution and lockfiles
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock site/bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts

  macos_fixtures:
    name: macOS synthetic Messages and Contacts fixtures
    needs: verify
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test generated fixtures with an isolated home
        env:
          HOME: ${{ runner.temp }}/message-like-me-fixture-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          bun test src/imessage.test.ts src/contacts.test.ts src/metrics.test.ts

  publish:
    name: Publish immutable GitHub Release
    needs:
      - verify
      - macos_fixtures
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERIFIED_SHA: ${{ needs.verify.outputs.verified_sha }}
      VERIFIED_TAG: ${{ needs.verify.outputs.verified_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.verify.outputs.verified_sha }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Publish verified GitHub Release
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Publish request has no verified stable release tag"
            exit 1
          fi
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publish request has no verified release commit"
            exit 1
          fi
          remote_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERIFIED_TAG" --jq '.sha')"
          current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$remote_tag_sha" != "$VERIFIED_SHA" || "$current_main_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error::Remote tag or current main moved from $VERIFIED_SHA"
            exit 1
          fi
          release_endpoint="/repos/$GITHUB_REPOSITORY/releases/tags/$VERIFIED_TAG"
          release_lookup_stderr="$(mktemp)"
          trap 'rm -f "$release_lookup_stderr"' EXIT
          set +e
          release_lookup="$(gh api --include "$release_endpoint" 2>"$release_lookup_stderr")"
          release_lookup_exit="$?"
          set -e
          release_lookup_state="$(printf '%s' "$release_lookup" | node ./scripts/release-provider-outcome.mjs inspect-release-response)"
          case "$release_lookup_state" in
            found)
              if [[ "$release_lookup_exit" -ne 0 ]]; then
                echo "::error::Exact Release lookup returned a Release with exit $release_lookup_exit"
                exit 1
              fi
              ;;
            missing)
              if [[ "$release_lookup_exit" -ne 1 ]]; then
                echo "::error::Exact Release absence returned unexpected exit $release_lookup_exit"
                exit 1
              fi
              ;;
            *)
              echo "::error::Exact Release lookup returned an unsupported state"
              exit 1
              ;;
          esac
          if [[ "$release_lookup_state" == "missing" ]]; then
            node ./scripts/release-provider-outcome.mjs release-order
            current_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
            remote_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERIFIED_TAG" --jq '.sha')"
            if [[ "$current_main_sha" != "$VERIFIED_SHA" || "$remote_tag_sha" != "$VERIFIED_SHA" ]]; then
              echo "::error::Release authority moved before publication"
              exit 1
            fi
            created_release="$(gh api \
              --method POST \
              "/repos/$GITHUB_REPOSITORY/releases" \
              -F draft=false \
              -F generate_release_notes=true \
              -f make_latest=true \
              -f name="Message Like Me $VERIFIED_TAG" \
              -F prerelease=false \
              -f tag_name="$VERIFIED_TAG" \
              -f target_commitish="$VERIFIED_SHA")"
            printf '%s' "$created_release" | node ./scripts/release-provider-outcome.mjs validate-release
          fi
          release_readback="$(gh api "$release_endpoint")"
          printf '%s' "$release_readback" | node ./scripts/release-provider-outcome.mjs validate-release
          latest_tag="$(gh api "/repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          terminal_tag_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$VERIFIED_TAG" --jq '.sha')"
          terminal_main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$latest_tag" != "$VERIFIED_TAG" || "$terminal_tag_sha" != "$VERIFIED_SHA" || "$terminal_main_sha" != "$VERIFIED_SHA" ]]; then
            echo "::error::Release authority changed during publication"
            exit 1
          fi
