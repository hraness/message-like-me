name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing direct desktop-v0.1.0-macos-arm64 tag at exact current main
        required: true
        type: string
      ci_run_id:
        description: Successful push-main CI run for that exact source
        required: true
        type: string
      ci_run_attempt:
        description: Exact successful CI attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: textbutler-desktop-release
  cancel-in-progress: false

env:
  DESKTOP_TAG: ${{ inputs.tag }}
  DESKTOP_CI_RUN_ID: ${{ inputs.ci_run_id }}
  DESKTOP_CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
  DESKTOP_RELEASE_WORKFLOW_ID: ${{ vars.DESKTOP_RELEASE_WORKFLOW_ID }}

jobs:
  authorize:
    if: github.repository_id == '1342143606' && github.repository == 'hraness/message-like-me' && github.ref == 'refs/heads/main' && github.actor_id == '894119'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact main, complete CI and independent owner-created desktop tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/authority.ts

  build:
    needs: authorize
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      receipt_sha256: ${{ steps.pack.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin Apple Silicon native toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Revalidate before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/authority.ts
      - name: Build and smoke without Apple credentials
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd apps/macos check
          cargo test --manifest-path apps/macos/src-tauri/Cargo.toml --locked
          bun run --cwd apps/macos native:package
          bun run --cwd apps/macos native:smoke
      - name: Seal the bounded unsigned handoff
        id: pack
        run: |
          set -euo pipefail
          bun --no-env-file --no-install apps/macos/distribution/prepare.ts "$GITHUB_SHA" "$RUNNER_TEMP/textbutler-unsigned"
          bun --no-env-file --no-install apps/macos/distribution/workflow-artifact.ts unsigned "$RUNNER_TEMP/textbutler-unsigned"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: artifact
        with:
          name: textbutler-desktop-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/textbutler-unsigned
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    environment: desktop-signing
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact unsigned artifact before download
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: bun --no-env-file --no-install apps/macos/distribution/authority.ts unsigned "$ARTIFACT_ID"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/textbutler-input
      - name: Revalidate source immediately before credential use
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun --no-env-file --no-install apps/macos/distribution/authority.ts
      - name: Sign and notarize without dependency installation, build hooks or app execution
        env:
          RECEIPT_SHA256: ${{ needs.build.outputs.receipt_sha256 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY_SHA1: ${{ vars.APPLE_SIGNING_IDENTITY_SHA1 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bun --no-env-file --no-install apps/macos/distribution/sign.ts "$RUNNER_TEMP/textbutler-input" "$RECEIPT_SHA256" "$GITHUB_SHA" "$RUNNER_TEMP/textbutler-signed"
      - name: Preserve exact notarization custody on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: textbutler-notary-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/textbutler-signed/notary-attempt.json
            ${{ runner.temp }}/textbutler-signed/notary-submission.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Emit exact signed receipt digest
        id: receipt
        run: bun --no-env-file --no-install apps/macos/distribution/workflow-artifact.ts signed "$RUNNER_TEMP/textbutler-signed"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: artifact
        with:
          name: textbutler-desktop-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/textbutler-signed/Textbutler-0.1.0-macos-arm64.zip
            ${{ runner.temp }}/textbutler-signed/signed-manifest.json
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: sign
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      hashes: ${{ steps.verify.outputs.hashes }}
      archive: ${{ steps.verify.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.sign.outputs.artifact_id }}
        run: bun --no-env-file --no-install apps/macos/distribution/authority.ts signed "$ARTIFACT_ID"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact_id }}
          path: ${{ runner.temp }}/textbutler-input
      - name: Install verifier dependencies on a credential-free runner
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify final signed bytes and actual packaged runtime
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_SHA256: ${{ needs.sign.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          bun --no-env-file --no-install apps/macos/distribution/authority.ts
          bun --no-env-file --no-install apps/macos/distribution/verify.ts "$RUNNER_TEMP/textbutler-input" "$RECEIPT_SHA256" "$GITHUB_SHA" "$RUNNER_TEMP/textbutler-verified"
          bun --no-env-file --no-install apps/macos/distribution/workflow-artifact.ts verified "$RUNNER_TEMP/textbutler-verified"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: artifact
        with:
          name: textbutler-desktop-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/textbutler-verified
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      provenance_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: ${{ runner.temp }}/textbutler-desktop
      - name: Reauthorize checkout-free provenance and exact subjects
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTORY: ${{ runner.temp }}/textbutler-desktop
          EXPECTED_HASHES: ${{ needs.verify.outputs.hashes }}
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),p=require('node:path'),c=require('node:crypto'),cp=require('node:child_process'),e=process.env;
          const repo='hraness/message-like-me',repoId=1342143606,prefix=`repos/${repo}`,workflow='.github/workflows/desktop-release.yml',sha=e.GITHUB_SHA,tag='desktop-v0.1.0-macos-arm64';
          const need=v=>{if(!v)throw Error('Desktop provenance authority or artifact differs');};
          const id=v=>{need(/^[1-9][0-9]*$/.test(String(v)));const n=Number(v);need(Number.isSafeInteger(n)&&n>0);return n;};
          const get=path=>JSON.parse(cp.execFileSync('gh',['api','--hostname','github.com','--method','GET',`${prefix}/${path}`],{timeout:30000,maxBuffer:4194304}));
          need(e.GITHUB_REPOSITORY===repo&&e.GITHUB_REPOSITORY_ID===String(repoId)&&e.GITHUB_REF==='refs/heads/main'&&e.GITHUB_EVENT_NAME==='workflow_dispatch'&&e.GITHUB_WORKFLOW_REF===`${repo}/${workflow}@refs/heads/main`&&e.GITHUB_WORKFLOW_SHA===sha&&e.GITHUB_ACTOR_ID==='894119'&&e.RUNNER_ENVIRONMENT==='github-hosted'&&e.DESKTOP_TAG===tag&&/^[a-f0-9]{40}$/.test(sha));
          const checkRef=(kind,name)=>{const r=get(`git/ref/${kind}/${name}`);need(r.ref===`refs/${kind}/${name}`&&r.object.type==='commit'&&r.object.sha===sha);};
          checkRef('heads','main');checkRef('tags',tag);
          const w=get(`actions/workflows/${id(e.DESKTOP_RELEASE_WORKFLOW_ID)}`);need(w.id===id(e.DESKTOP_RELEASE_WORKFLOW_ID)&&w.path===workflow&&w.state==='active');
          for(const path of[`actions/runs/${id(e.GITHUB_RUN_ID)}`,`actions/runs/${id(e.GITHUB_RUN_ID)}/attempts/${id(e.GITHUB_RUN_ATTEMPT)}`]){const r=get(path);need(r.id===id(e.GITHUB_RUN_ID)&&r.run_attempt===id(e.GITHUB_RUN_ATTEMPT)&&r.workflow_id===w.id&&r.path===workflow&&r.head_sha===sha&&r.head_branch==='main'&&r.event==='workflow_dispatch'&&r.status==='in_progress'&&r.conclusion===null);for(const q of[r.repository,r.head_repository])need(q.id===repoId&&q.full_name===repo&&q.private===false);for(const q of[r.actor,r.triggering_actor])need(q.id===894119&&q.type==='User');}
          const ci=get('actions/workflows/ci.yml');need(ci.path==='.github/workflows/ci.yml'&&ci.name==='CI'&&ci.state==='active');
          for(const path of[`actions/runs/${id(e.DESKTOP_CI_RUN_ID)}`,`actions/runs/${id(e.DESKTOP_CI_RUN_ID)}/attempts/${id(e.DESKTOP_CI_RUN_ATTEMPT)}`]){const r=get(path);need(r.id===id(e.DESKTOP_CI_RUN_ID)&&r.run_attempt===id(e.DESKTOP_CI_RUN_ATTEMPT)&&r.workflow_id===ci.id&&r.path===ci.path&&r.name==='CI'&&r.event==='push'&&r.head_branch==='main'&&r.head_sha===sha&&r.status==='completed'&&r.conclusion==='success');for(const q of[r.repository,r.head_repository])need(q.id===repoId&&q.full_name===repo);}
          const jobs=get(`actions/runs/${id(e.DESKTOP_CI_RUN_ID)}/attempts/${id(e.DESKTOP_CI_RUN_ATTEMPT)}/jobs?per_page=100`);need(jobs.total_count===2&&jobs.jobs.length===2&&jobs.jobs.map(j=>j.name).sort().join(',')===['Standalone package','macOS synthetic Messages and Contacts fixtures'].sort().join(','));for(const j of jobs.jobs)need(j.run_id===id(e.DESKTOP_CI_RUN_ID)&&j.run_attempt===id(e.DESKTOP_CI_RUN_ATTEMPT)&&j.head_sha===sha&&j.status==='completed'&&j.conclusion==='success'&&Number.isFinite(Date.parse(j.completed_at)));
          const artifact=get(`actions/artifacts/${id(e.ARTIFACT_ID)}`);need(artifact.id===id(e.ARTIFACT_ID)&&artifact.name===`textbutler-desktop-verified-${e.GITHUB_RUN_ID}-${e.GITHUB_RUN_ATTEMPT}`&&artifact.expired===false&&/^sha256:[a-f0-9]{64}$/.test(artifact.digest)&&artifact.size_in_bytes>0&&artifact.size_in_bytes<=838860800&&artifact.workflow_run.id===id(e.GITHUB_RUN_ID)&&artifact.workflow_run.head_sha===sha&&artifact.workflow_run.head_branch==='main');
          const names=['Textbutler-0.1.0-macos-arm64.zip','desktop-manifest.json','SHA256SUMS'],dir=e.DIRECTORY,hashes=JSON.parse(e.EXPECTED_HASHES);
          need(fs.readdirSync(dir).sort().join(',')===[...names].sort().join(',')&&Object.keys(hashes).sort().join(',')===[...names].sort().join(','));
          for(const name of names){const path=p.join(dir,name),s=fs.lstatSync(path);need(s.isFile()&&!s.isSymbolicLink()&&s.nlink===1&&(s.mode&0o022)===0&&s.size>0&&s.size<=(name===names[0]?805306368:1048576));need(/^[a-f0-9]{64}$/.test(hashes[name])&&c.createHash('sha256').update(fs.readFileSync(path)).digest('hex')===hashes[name]);}
          const m=JSON.parse(fs.readFileSync(p.join(dir,'desktop-manifest.json'),'utf8')),a=m.workflowAuthority;need(m.schema==='textbutler.desktop-release.v1'&&m.unsigned.sourceSha===sha&&m.unsigned.tag===tag&&m.archive.sha256===hashes[names[0]]&&m.notarization.status==='Accepted'&&m.notarization.stapled===true&&a.repository===repo&&a.repositoryId===repoId&&a.workflow===workflow&&a.workflowSha===sha&&a.workflowId===w.id&&a.runId===id(e.GITHUB_RUN_ID)&&a.runAttempt===id(e.GITHUB_RUN_ATTEMPT)&&a.ciRunId===id(e.DESKTOP_CI_RUN_ID)&&a.ciRunAttempt===id(e.DESKTOP_CI_RUN_ATTEMPT));
          need(fs.readFileSync(p.join(dir,'SHA256SUMS'),'utf8')===`${hashes[names[0]]}  ${names[0]}\n${hashes[names[1]]}  ${names[1]}\n`);checkRef('heads','main');
          NODE
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            ${{ runner.temp }}/textbutler-desktop/${{ needs.verify.outputs.archive }}
            ${{ runner.temp }}/textbutler-desktop/desktop-manifest.json
            ${{ runner.temp }}/textbutler-desktop/SHA256SUMS
          push-to-registry: false
          create-storage-record: false
      - name: Preserve exact provenance bytes
        id: bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE" "$RUNNER_TEMP/textbutler-desktop/provenance.jsonl"
          printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/textbutler-desktop/provenance.jsonl" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: artifact
        with:
          name: textbutler-desktop-attested-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/textbutler-desktop
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Admit exact attested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.attest.outputs.artifact_id }}
        run: bun --no-env-file --no-install apps/macos/distribution/authority.ts attested "$ARTIFACT_ID"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          path: ${{ runner.temp }}/textbutler-desktop
      - name: Verify provenance and publish exact immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_HASHES: ${{ needs.verify.outputs.hashes }}
          DESKTOP_PROVENANCE_SHA256: ${{ needs.attest.outputs.provenance_sha256 }}
        run: bun --no-env-file --no-install apps/macos/distribution/publish.ts "$RUNNER_TEMP/textbutler-desktop"
